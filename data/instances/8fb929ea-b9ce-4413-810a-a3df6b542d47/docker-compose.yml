version: '3.8'

services:
  minecraft--java---1:
    build: .
    container_name: minecraft--java---1-8fb929ea
    restart: unless-stopped
    environment:
      - SERVER_PORT=25565
      - MEMORY_MB=2048
      - EULA=true
    deploy:
      resources:
        limits:
          memory: 1 GB
          cpus: '1 vCPU'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
