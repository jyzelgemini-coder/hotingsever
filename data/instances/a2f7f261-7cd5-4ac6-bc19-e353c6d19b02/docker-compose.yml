version: '3.8'

services:
  demo-telegram-bot:
    build: .
    container_name: demo-telegram-bot-a2f7f261
    restart: unless-stopped
    environment:
      - BOT_TOKEN=YOUR_TELEGRAM_BOT_TOKEN_HERE
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 512MB
          cpus: '0.5 vCPU'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
