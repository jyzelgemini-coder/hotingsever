version: '3.8'

services:
  demo-discord-bot:
    build: .
    container_name: demo-discord-bot-92387832
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=YOUR_DISCORD_BOT_TOKEN_HERE
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 512MB
          cpus: '0.5 vCPU'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
