version: '3.8'

services:
  telegram-bot--python---1:
    build: .
    container_name: telegram-bot--python---1-63734720
    restart: unless-stopped
    environment:
      - BOT_TOKEN=
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          memory: 0.5 GB
          cpus: '1 vCPU'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
